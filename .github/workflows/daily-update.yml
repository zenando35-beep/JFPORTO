name: Atualização diária das estatísticas

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descarregar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ir buscar os dados e calcular as estatísticas
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: python fetch_data.py

      - name: Guardar o resultado no repositório
        run: |
          git config user.name "scoreboard-bot"
          git config user.email "scoreboard-bot@users.noreply.github.com"
          git add data/data.json
          git diff --quiet --cached || git commit -m "Atualização automática de $(date +'%Y-%m-%d')"
          git push
